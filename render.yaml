# Render Blueprint for SECOND SELF (a static site: no server needed).
services:
  - type: web
    runtime: static
    name: second-self
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Permissions-Policy
        value: xr-spatial-tracking=(self)
