# Render Blueprint for SECOND SELF.
# second-self-coop: Node Web Service that serves the game AND runs co-op multiplayer (use this one).
# second-self: the original static site (single player only, unless VITE_MP_SERVER points at the web service).
services:
  - type: web
    runtime: static
    name: second-self
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Permissions-Policy
        value: xr-spatial-tracking=(self)

  - type: web
    runtime: node
    name: second-self-coop
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
